<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  <body>

    <div class="container content">
      <header class="masthead">
        <h3 class="masthead-title">
          <a href="{{ site.baseurl }}/" title="Home">{{ site.title }}</a>
          
          {% for page in site.pages_list %}
          &nbsp;&nbsp;&nbsp;<small><a href="{{ page[1]  }}">{{ page[0] }}</a></small>
          {% endfor %}
          <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
            <svg class="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM11 1h2v3h-2V1zm0 19h2v3h-2v-3zM3.515 4.929l1.414-1.414L7.05 5.636 5.636 7.05 3.515 4.93zM16.95 18.364l1.414-1.414 2.121 2.121-1.414 1.414-2.121-2.121zm2.121-14.85l1.414 1.415-2.121 2.121-1.414-1.414 2.121-2.121zM5.636 16.95l1.414 1.414-2.121 2.121-1.414-1.414 2.121-2.121zM23 11v2h-3v-2h3zM4 11v2H1v-2h3z"/></svg>
            <svg class="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M10 7a7 7 0 0 0 12 4.9v.1c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2h.1A6.98 6.98 0 0 0 10 7zm-6 5a8 8 0 0 0 15.062 3.762A9 9 0 0 1 8.238 4.938 7.999 7.999 0 0 0 4 12z"/></svg>
          </button>
        </h3>
      </header>

      <main>
        {{ content }}
      </main>

      <footer class="footer">

      </footer>
    </div>

    <script>
      (function() {
        var toggle = document.querySelector('.theme-toggle');
        var root = document.documentElement;

        function getEffectiveTheme() {
          var saved = root.getAttribute('data-theme');
          if (saved) return saved;
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function updateIcon() {
          var isDark = getEffectiveTheme() === 'dark';
          toggle.querySelector('.theme-icon-sun').style.display = isDark ? 'inline' : 'none';
          toggle.querySelector('.theme-icon-moon').style.display = isDark ? 'none' : 'inline';
        }

        toggle.addEventListener('click', function() {
          var current = getEffectiveTheme();
          var next = current === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          updateIcon();
        });

        updateIcon();

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
          if (!localStorage.getItem('theme')) {
            updateIcon();
          }
        });
      })();
    </script>

    {% if site.analytics_id %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics_id }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.analytics_id }}');
    </script>
    {% endif %}
  </body>
</html>
