<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title == "Home" %}
      {{ site.title }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  {% if page.description %}
    <meta name="description" content="{{ page.description }}">
  {% elsif page.excerpt %}
    <meta name="description" content="{{ page.excerpt | strip_html | truncate: 160 }}">
  {% else %}
    <meta name="description" content="{{ site.title }}">
  {% endif %}

  <link rel="canonical" href="{{ site.url }}{{ page.url }}">

  <!-- Open Graph -->
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  {% if page.description %}
    <meta property="og:description" content="{{ page.description }}">
  {% elsif page.excerpt %}
    <meta property="og:description" content="{{ page.excerpt | strip_html | truncate: 160 }}">
  {% endif %}

  <link rel="stylesheet" href="{{ site.baseurl }}/styles.css">
  <link rel="shortcut icon" href="{{ site.baseurl }}/assets/images/tim.png">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ site.baseurl }}/atom.xml">
  <!-- flag: Qm9udXMgcG9pbnRzIGZvciB5b3Uh -->
</head>
