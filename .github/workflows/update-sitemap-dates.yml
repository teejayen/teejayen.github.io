name: Update Sitemap Dates

on:
  push:
    branches: [main, master]
    paths:
      - '**.md'
      - '**.html'
      - '!_data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for accurate dates

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate lastmod dates from git history
        run: python .github/scripts/update_sitemap_dates.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/git_lastmod.yml
          git diff --staged --quiet || (git commit -m "Update sitemap dates from git history [skip ci]" && git push)
